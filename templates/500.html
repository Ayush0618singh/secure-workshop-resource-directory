{% extends "base.html" %}

{% block title %}
Application Error
{% endblock %}


{% block content %}

<section class="error-page">

    <div class="error-card">

        <div class="error-code">
            500
        </div>

        <h1>
            Something Went Wrong
        </h1>

        <p>
            The application encountered an unexpected
            error. Technical details have not been
            exposed to the user.
        </p>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-primary"
        >
            Return Home
        </a>

    </div>

</section>

{% endblock %}
