{% extends "base.html" %}

{% block title %}
Page Not Found
{% endblock %}


{% block content %}

<section class="error-page">

    <div class="error-card">

        <div class="error-code">
            404
        </div>

        <h1>
            Resource Not Found
        </h1>

        <p>
            The page or workshop resource you
            requested does not exist.
        </p>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-primary"
        >
            Return to Directory
        </a>

    </div>

</section>

{% endblock %}
