{% extends "base.html" %}

{% block title %}
Invalid Request
{% endblock %}


{% block content %}

<section class="error-page">

    <div class="error-card">

        <div class="error-code">
            400
        </div>

        <h1>
            Invalid Request
        </h1>

        <p>
            The request could not be processed safely.
            Please return to the previous page and try again.
        </p>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-primary"
        >
            Return Home
        </a>

    </div>

</section>

{% endblock %}
